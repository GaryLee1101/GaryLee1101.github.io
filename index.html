<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课堂随机点名</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5',
                        secondary: '#EC4899',
                        accent: '#10B981',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .float-animation {
                animation: float 3s ease-in-out infinite;
            }
            .shadow-custom {
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            }
            .result-overlay {
                backdrop-filter: blur(4px);
                -webkit-backdrop-filter: blur(4px);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-5px);
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- 顶部导航 -->
    <header class="bg-gradient-to-r from-primary to-secondary text-white shadow-lg">
        <div class="container mx-auto px-4 py-6">
            <h1 class="text-[clamp(1.8rem,5vw,3rem)] font-bold flex items-center">
                <i class="fa fa-graduation-cap mr-3"></i>
                课堂随机点名
            </h1>
            <p class="text-lg mt-2 opacity-90">趣味点名，活跃课堂气氛</p>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="flex-grow container mx-auto px-4 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <!-- 左侧控制面板 -->
            <div class="lg:col-span-1 bg-white rounded-xl shadow-custom p-5 transition-all duration-300 hover:shadow-xl">
                <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                    <i class="fa fa-sliders mr-2 text-primary"></i>
                    控制面板
                </h2>
                
                <!-- 上传照片区域 -->
                <div class="mb-5">
                    <label class="block text-gray-700 font-medium mb-2">上传课堂照片</label>
                    <div id="upload-area" class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center cursor-pointer transition-all duration-300 hover:border-primary hover:bg-blue-50">
                        <i class="fa fa-cloud-upload text-3xl text-gray-400 mb-2"></i>
                        <p class="text-gray-500 text-sm">点击或拖拽照片到这里</p>
                        <p class="text-xs text-gray-400 mt-1">支持 JPG、PNG 格式</p>
                        <input type="file" id="photo-upload" accept="image/*" class="hidden">
                    </div>
                </div>
                
                <!-- 兔子选择 -->
                <div class="mb-5">
                    <label class="block text-gray-700 font-medium mb-2">选择指示图标</label>
                    <div class="grid grid-cols-4 gap-2">
                        <div class="rabbit-option p-1.5 border-2 rounded cursor-pointer transition-all duration-300 hover:border-primary" data-rabbit="1">
                            <i class="fa fa-paw text-xl text-gray-600"></i>
                        </div>
                        <div class="rabbit-option p-1.5 border-2 rounded cursor-pointer transition-all duration-300 hover:border-primary" data-rabbit="2">
                            <i class="fa fa-hand-pointer-o text-xl text-yellow-500"></i>
                        </div>
                        <div class="rabbit-option p-1.5 border-2 rounded cursor-pointer transition-all duration-300 hover:border-primary" data-rabbit="3">
                            <i class="fa fa-heart text-xl text-red-500"></i>
                        </div>
                        <div class="rabbit-option p-1.5 border-2 rounded cursor-pointer transition-all duration-300 hover:border-primary" data-rabbit="4">
                            <i class="fa fa-star text-xl text-yellow-400"></i>
                        </div>
                    </div>
                </div>
                
                <!-- 设置区域 -->
                <div class="mb-5">
                    <label class="block text-gray-700 font-medium mb-2">点名设置</label>
                    <div class="space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="text-gray-600 text-sm">动画速度</span>
                            <input type="range" id="speed-control" min="1" max="10" value="5" class="w-24 accent-primary">
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-gray-600 text-sm">点名时长 (秒)</span>
                            <input type="number" id="duration-control" min="2" max="20" value="5" class="w-14 border border-gray-300 rounded px-1.5 py-0.5 text-center text-sm">
                        </div>
                    </div>
                </div>
                
                <!-- 操作按钮 -->
                <div class="flex space-x-2">
                    <button id="start-btn" class="flex-1 bg-primary hover:bg-primary/90 text-white font-medium py-2.5 px-3 rounded-lg transition-all duration-300 transform hover:scale-105 flex items-center justify-center text-sm">
                        <i class="fa fa-play-circle mr-1.5"></i>
                        开始点名
                    </button>
                    <button id="reset-btn" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-2.5 px-3 rounded-lg transition-all duration-300 text-sm">
                        <i class="fa fa-refresh"></i>
                    </button>
                </div>
            </div>
            
            <!-- 中间显示区域 -->
            <div class="lg:col-span-3">
                <div class="bg-white rounded-xl shadow-custom p-6 transition-all duration-300 hover:shadow-xl h-full flex flex-col">
                    <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                        <i class="fa fa-desktop mr-2 text-primary"></i>
                        点名区域
                    </h2>
                    
                    <!-- 点名状态显示 -->
                    <div id="status-display" class="mb-4 p-3 rounded-lg bg-blue-50 text-center hidden">
                        <p id="status-text" class="text-gray-700 text-sm">准备点名...</p>
                    </div>
                    
                    <!-- 照片显示区域 -->
                    <div id="photo-container" class="relative flex-grow border-2 border-gray-200 rounded-lg overflow-hidden bg-gray-100">
                        <div id="no-photo-message" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400">
                            <i class="fa fa-image text-5xl mb-3"></i>
                            <p class="text-lg">请上传一张课堂照片</p>
                        </div>
                        <img id="displayed-photo" src="" alt="课堂照片" class="absolute inset-0 w-full h-full object-contain hidden">
                        <div id="rabbit" class="absolute w-10 h-10 bg-white rounded-full shadow-lg flex items-center justify-center opacity-0 transition-opacity duration-300">
                            <i id="rabbit-icon" class="fa fa-paw text-xl text-primary"></i>
                        </div>
                        
                        <!-- 点名结果（显示在照片上方） -->
                        <div id="result-display" class="absolute inset-0 flex items-center justify-center bg-black/30 result-overlay z-10 hidden">
                            <div class="bg-white p-4 rounded-lg shadow-xl max-w-md w-full mx-4 transform transition-all duration-500 scale-95 opacity-0" id="result-card">
                                <h3 class="font-bold text-lg text-gray-800 mb-2 text-center">点名结果</h3>
                                <div class="text-gray-700 text-center py-2">
                                    <span id="result-icon-text-lg" class="font-bold">兔子</span>
                                    <span>停在了坐标:</span>
                                    <div class="mt-2 text-xl font-bold text-primary">
                                        <span id="result-position-lg">X: ?, Y: ?</span>
                                    </div>
                                </div>
                                <div class="mt-4 flex justify-center">
                                    <button id="close-result" class="bg-primary hover:bg-primary/90 text-white font-medium py-1.5 px-4 rounded-lg transition-all duration-300 text-sm">
                                        继续
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 原结果显示区域（已移除） -->
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-gray-800 text-white py-6 mt-12">
        <div class="container mx-auto px-4 text-center">
            <p>© 2025 课堂随机点名系统 | 让课堂互动更有趣</p>
            <p class="text-sm mt-2 text-gray-400">上传照片后点击开始点名，图标会随机选择一名同学</p>
        </div>
    </footer>

    <script>
        // DOM元素
        const uploadArea = document.getElementById('upload-area');
        const photoUpload = document.getElementById('photo-upload');
        const displayedPhoto = document.getElementById('displayed-photo');
        const noPhotoMessage = document.getElementById('no-photo-message');
        const startBtn = document.getElementById('start-btn');
        const resetBtn = document.getElementById('reset-btn');
        const rabbit = document.getElementById('rabbit');
        const rabbitIcon = document.getElementById('rabbit-icon');
        const statusDisplay = document.getElementById('status-display');
        const statusText = document.getElementById('status-text');
        const resultDisplay = document.getElementById('result-display');
        const resultCard = document.getElementById('result-card');
        const resultPosition = document.getElementById('result-position-lg');
        const resultIconText = document.getElementById('result-icon-text-lg');
        const closeResultBtn = document.getElementById('close-result');
        const speedControl = document.getElementById('speed-control');
        const durationControl = document.getElementById('duration-control');
        const rabbitOptions = document.querySelectorAll('.rabbit-option');
        
        // 变量
        let isRolling = false;
        let animationId = null;
        let selectedRabbit = 'fa-paw';
        let photoContainer = null;
        let containerRect = null;
        let photoRect = null;
        let photoAspectRatio = 1;
        let resizeTimeout = null;
        
        // 平滑动画相关变量
        let currentX = 0;
        let currentY = 0;
        let targetX = 0;
        let targetY = 0;
        let easeFactor = 0.05; // 缓动系数，值越小移动越慢越平滑
        
        // 图标名称映射
        const iconNames = {
            'fa-paw': '爪子',
            'fa-hand-pointer-o': '手指',
            'fa-heart': '爱心',
            'fa-star': '星星'
        };
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            photoContainer = document.getElementById('photo-container');
            
            // 兔子选项点击事件
            rabbitOptions.forEach(option => {
                option.addEventListener('click', () => {
                    // 移除所有选中状态
                    rabbitOptions.forEach(opt => opt.classList.remove('border-primary', 'bg-blue-50'));
                    rabbitOptions.forEach(opt => opt.classList.add('border-gray-200'));
                    
                    // 添加当前选中状态
                    option.classList.remove('border-gray-200');
                    option.classList.add('border-primary', 'bg-blue-50');
                    
                    // 更新兔子图标
                    const iconClass = option.querySelector('i').className.split(' ')[1];
                    selectedRabbit = iconClass;
                    rabbitIcon.className = `fa ${selectedRabbit} text-xl text-primary`;
                    
                    // 更新结果文本
                    updateResultIconText();
                });
            });
            
            // 默认选中第一个兔子
            rabbitOptions[0].click();
            
            // 窗口大小变化时重新计算容器尺寸（添加防抖）
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(updateContainerAndPhotoRect, 100);
            });
            
            // 关闭结果按钮
            closeResultBtn.addEventListener('click', () => {
                hideResult();
            });
        });
        
        // 更新容器和照片尺寸信息
        function updateContainerAndPhotoRect() {
            if (photoContainer) {
                containerRect = photoContainer.getBoundingClientRect();
                
                // 如果照片已加载，计算照片的实际尺寸和位置
                if (displayedPhoto.src && displayedPhoto.complete) {
                    photoAspectRatio = displayedPhoto.naturalWidth / displayedPhoto.naturalHeight;
                    calculatePhotoRect();
                    
                    // 如果兔子可见，更新其位置
                    if (rabbit.style.opacity !== '0') {
                        // 确保兔子在照片区域内
                        if (photoRect) {
                            const maxX = photoRect.left + photoRect.width - rabbit.offsetWidth;
                            const maxY = photoRect.top + photoRect.height - rabbit.offsetHeight;
                            
                            currentX = Math.max(photoRect.left, Math.min(currentX, maxX));
                            currentY = Math.max(photoRect.top, Math.min(currentY, maxY));
                            
                            rabbit.style.left = `${currentX}px`;
                            rabbit.style.top = `${currentY}px`;
                        }
                    }
                }
            }
        }
        
        // 计算照片在容器中的实际位置和尺寸
        function calculatePhotoRect() {
            if (!containerRect) return;
            
            const containerRatio = containerRect.width / containerRect.height;
            
            let photoWidth, photoHeight, photoLeft, photoTop;
            
            // 根据容器和照片的宽高比确定如何适应
            if (photoAspectRatio > containerRatio) {
                // 照片更宽，宽度占满容器
                photoWidth = containerRect.width;
                photoHeight = photoWidth / photoAspectRatio;
                photoLeft = 0;
                photoTop = (containerRect.height - photoHeight) / 2;
            } else {
                // 照片更高，高度占满容器
                photoHeight = containerRect.height;
                photoWidth = photoHeight * photoAspectRatio;
                photoTop = 0;
                photoLeft = (containerRect.width - photoWidth) / 2;
            }
            
            photoRect = {
                left: photoLeft,
                top: photoTop,
                width: photoWidth,
                height: photoHeight
            };
        }
        
        // 上传照片相关事件
        uploadArea.addEventListener('click', () => photoUpload.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('border-primary', 'bg-blue-50');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('border-primary', 'bg-blue-50');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('border-primary', 'bg-blue-50');
            
            if (e.dataTransfer.files.length) {
                handleImageUpload(e.dataTransfer.files[0]);
            }
        });
        
        photoUpload.addEventListener('change', () => {
            if (photoUpload.files.length) {
                handleImageUpload(photoUpload.files[0]);
            }
        });
        
        // 处理上传的图片
        function handleImageUpload(file) {
            const reader = new FileReader();
            
            reader.onload = (e) => {
                displayedPhoto.src = e.target.result;
                displayedPhoto.classList.remove('hidden');
                noPhotoMessage.classList.add('hidden');
                
                // 图片加载完成后更新容器信息
                displayedPhoto.onload = () => {
                    updateContainerAndPhotoRect();
                    // 重置按钮状态
                    resetRollCall();
                };
            };
            
            reader.readAsDataURL(file);
        }
        
        // 开始点名
        startBtn.addEventListener('click', () => {
            if (isRolling) {
                stopRollCall();
            } else {
                startRollCall();
            }
        });
        
        // 重置点名
        function resetRollCall() {
            isRolling = false;
            
            // 停止动画
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            
            // 重置按钮
            startBtn.innerHTML = '<i class="fa fa-play-circle mr-1.5"></i> 开始点名';
            startBtn.classList.remove('bg-red-500', 'hover:bg-red-600');
            startBtn.classList.add('bg-primary', 'hover:bg-primary/90');
            
            // 隐藏兔子
            rabbit.style.opacity = '0';
            rabbit.classList.remove('float-animation');
            
            // 隐藏状态和结果
            statusDisplay.classList.add('hidden');
            hideResult();
            
            // 刷新照片位置
            updateContainerAndPhotoRect();
        }
        
        // 更新结果中的图标文本
        function updateResultIconText() {
            if (resultIconText) {
                resultIconText.textContent = iconNames[selectedRabbit] || '图标';
            }
        }
        
        // 隐藏结果显示
        function hideResult() {
            resultDisplay.classList.add('hidden');
            resultCard.classList.remove('scale-100', 'opacity-100');
            resultCard.classList.add('scale-95', 'opacity-0');
        }
        
        // 显示结果
        function showResult() {
            if (photoRect && rabbit) {
                const rabbitRect = rabbit.getBoundingClientRect();
                
                // 计算兔子在照片内的相对位置
                const relativeX = Math.round(((rabbitRect.left - photoRect.left) / photoRect.width) * 100);
                const relativeY = Math.round(((rabbitRect.top - photoRect.top) / photoRect.height) * 100);
                
                resultPosition.textContent = `X: ${relativeX}%, Y: ${relativeY}%`;
                
                // 显示结果
                resultDisplay.classList.remove('hidden');
                
                // 添加动画效果
                setTimeout(() => {
                    resultCard.classList.remove('scale-95', 'opacity-0');
                    resultCard.classList.add('scale-100', 'opacity-100');
                }, 10);
            }
        }
        
        // 开始随机点名
        function startRollCall() {
            // 检查是否已上传照片
            if (!displayedPhoto.src || displayedPhoto.classList.contains('hidden')) {
                alert('请先上传一张课堂照片');
                return;
            }
            
            // 确保照片尺寸信息已更新
            updateContainerAndPhotoRect();
            
            if (!photoRect) {
                alert('无法获取照片尺寸信息，请重试');
                return;
            }
            
            isRolling = true;
            startBtn.innerHTML = '<i class="fa fa-stop-circle mr-1.5"></i> 停止点名';
            startBtn.classList.remove('bg-primary', 'hover:bg-primary/90');
            startBtn.classList.add('bg-red-500', 'hover:bg-red-600');
            
            // 显示状态
            statusDisplay.classList.remove('hidden');
            statusText.textContent = '正在点名...';
            statusDisplay.classList.remove('bg-green-50', 'bg-yellow-50');
            statusDisplay.classList.add('bg-blue-50');
            
            // 隐藏结果
            hideResult();
            
            // 显示兔子
            rabbit.style.opacity = '1';
            
            // 初始化兔子位置
            if (photoRect) {
                // 初始位置设为照片中心
                currentX = photoRect.left + photoRect.width / 2;
                currentY = photoRect.top + photoRect.height / 2;
                targetX = currentX;
                targetY = currentY;
                rabbit.style.left = `${currentX}px`;
                rabbit.style.top = `${currentY}px`;
            }
            
            // 获取速度和时长设置
            const speed = parseInt(speedControl.value);
            const duration = parseInt(durationControl.value) * 1000; // 转换为毫秒
            
            // 计算缓动系数 (速度越快，系数越大，移动越快)
            easeFactor = 0.02 + (speed * 0.03); // 范围从0.02到0.32
            
            // 设置随机目标点计时器
            const targetInterval = 500 + (1000 - (speed * 100)); // 速度越快，目标点更新越频繁
            let targetTimer = setInterval(() => {
                if (photoRect && isRolling) {
                    // 计算兔子可移动的区域（考虑兔子自身大小，限制在照片范围内）
                    const maxX = photoRect.left + photoRect.width - rabbit.offsetWidth;
                    const maxY = photoRect.top + photoRect.height - rabbit.offsetHeight;
                    
                    // 设置新目标点（在照片范围内）
                    targetX = photoRect.left + Math.floor(Math.random() * (photoRect.width - rabbit.offsetWidth));
                    targetY = photoRect.top + Math.floor(Math.random() * (photoRect.height - rabbit.offsetHeight));
                }
            }, targetInterval);
            
            // 平滑移动动画
            function animate(timestamp) {
                if (isRolling && photoRect) {
                    // 平滑移动到目标点
                    currentX += (targetX - currentX) * easeFactor;
                    currentY += (targetY - currentY) * easeFactor;
                    
                    // 设置兔子位置
                    rabbit.style.left = `${currentX}px`;
                    rabbit.style.top = `${currentY}px`;
                    
                    animationId = requestAnimationFrame(animate);
                }
            }
            
            animate();
            
            // 设置自动停止时间
            setTimeout(() => {
                if (isRolling) {
                    clearInterval(targetTimer);
                    stopRollCall();
                }
            }, duration);
        }
        
        // 停止随机点名
        function stopRollCall() {
            isRolling = false;
            startBtn.innerHTML = '<i class="fa fa-play-circle mr-1.5"></i> 开始点名';
            startBtn.classList.remove('bg-red-500', 'hover:bg-red-600');
            startBtn.classList.add('bg-primary', 'hover:bg-primary/90');
            
            // 停止动画
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            
            // 更新状态
            statusText.textContent = '点名完成！';
            statusDisplay.classList.remove('bg-blue-50', 'bg-yellow-50');
            statusDisplay.classList.add('bg-green-50');
            
            // 兔子轻微浮动效果
            rabbit.classList.add('float-animation');
            
            // 显示结果
            showResult();
        }
    </script>
</body>
</html>
